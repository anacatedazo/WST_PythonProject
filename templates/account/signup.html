{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack | Sign Up</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-dark text-light">

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg" style="max-width: 750px; width: 100%;">
      <div class="row g-0">
        
        <!-- Left Side -->
        <div class="col-md-6 bg-danger d-flex flex-column justify-content-center align-items-center text-white p-4">
          <h2 class="mb-2">FitTrack</h2>
          <h4>Join the Progress</h4>
          <div class="rounded-circle bg-light mt-4" style="width:120px; height:120px;"></div>
        </div>

        <!-- Right Side -->
        <div class="col-md-6 p-4">
          <h3 class="text-center mb-4 text-dark">SIGN UP</h3>

          <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-dark">Full Name</label>
                <input type="text" name="fullname" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-dark">Student ID</label>
                <input type="text" name="student_id" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-dark">Section</label>
                <input type="text" name="section" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-dark">Age</label>
                <input type="number" name="age" class="form-control" required>
              </div>
              <div class="col-md-12 mb-3">
                <label class="form-label text-dark">Email Address</label>
                <input type="email" name="email" class="form-control" required>
              </div>
              <div class="col-md-12 mb-3">
                <label class="form-label text-dark">Password</label>
                <input type="password" name="password" class="form-control" required>
              </div>
            </div>

            <div class="d-grid mt-3">
              <button type="submit" class="btn btn-danger">Sign Up</button>
            </div>
          </form>

          <p class="mt-3 text-center text-dark">
            Already have an account?
            <a href="{% url 'login' %}" class="text-danger">Login Here</a>
          </p>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
